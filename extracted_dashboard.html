<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신한라이프 카카오톡 고객 관리 프로그램</title>
<style>
  :root {
    --bg-main: #0B132B;
    --card-bg: #1C2541;
    --accent: #4895EF;
    --accent-glow: #4CC9F0;
    --success: #00E676;
    --danger: #FF3D71;
    --text-light: #F8F9FA;
    --text-muted: #8D99AE;
    --input-bg: #0d1b2a;
    --border-color: #2b3a67;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
  
  #lock-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at center, #1C2541 0%, #0B132B 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999;
  }
  .lock-box {
    background: rgba(28, 37, 65, 0.85); backdrop-filter: blur(12px);
    padding: 40px; border-radius: 20px; border: 1px solid rgba(76, 201, 240, 0.2);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%;
  }
  .lock-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: var(--accent-glow); }
  .lock-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }
  .lock-input {
    width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border-color);
    border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 20px; text-align: center;
    outline: none; transition: 0.3s;
  }
  .lock-input:focus { border-color: var(--accent-glow); box-shadow: 0 0 10px rgba(76, 201, 240, 0.3); }
  .lock-btn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-glow));
    border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
    box-shadow: 0 5px 15px rgba(72, 149, 239, 0.4); transition: 0.3s;
  }
  .lock-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(72, 149, 239, 0.6); }

  .header {
    background: var(--card-bg); padding: 20px 30px; display: flex; justify-content: space-between;
    align-items: center; border-bottom: 1px solid var(--border-color);
  }
  .header-left { display: flex; align-items: center; gap: 15px; }
  .logo-box { background: linear-gradient(135deg, #0056b3, #0096FF); padding: 8px 12px; border-radius: 8px; }
  .brand-text { font-size: 13px; font-weight: 900; letter-spacing: 1px; color: #fff; }
  .header h1 { font-size: 18px; font-weight: 700; }
  
  .body { padding: 25px 30px; display: flex; gap: 25px; flex: 1; }
  .card {
    background: var(--card-bg); border-radius: 16px; padding: 22px; border: 1px solid var(--border-color);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  
  .left-panel { width: 380px; display: flex; flex-direction: column; gap: 16px; }
  .right-panel { flex: 1; display: flex; flex-direction: column; gap: 16px; }

  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--accent-glow); }
  .form label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
  .form select, .form textarea, .form input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px;
    color: #fff; padding: 10px; font-size: 13px; outline: none; margin-bottom: 12px;
  }
  .form textarea { height: 110px; resize: none; line-height: 1.4; }

  /* 사진 첨부 섹션 */
  .img-upload-box {
    background: rgba(11, 19, 43, 0.6); border: 1px dashed var(--accent); border-radius: 10px;
    padding: 14px; text-align: center; margin-bottom: 14px;
  }
  .img-preview { max-width: 100%; max-height: 140px; border-radius: 8px; margin-top: 10px; display: none; object-fit: contain; }
  .img-btn-row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .file-btn {
    padding: 8px 14px; background: rgba(72, 149, 239, 0.2); border: 1px solid var(--accent);
    border-radius: 6px; color: var(--accent-glow); font-size: 12px; font-weight: bold; cursor: pointer;
  }
  .del-img-btn {
    padding: 8px 14px; background: rgba(255, 61, 113, 0.2); border: 1px solid var(--danger);
    border-radius: 6px; color: #ff85a2; font-size: 12px; font-weight: bold; cursor: pointer; display: none;
  }

  .save-btn {
    width: 100%; padding: 12px; background: linear-gradient(135deg, #0056b3, var(--accent));
    border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .save-btn:hover { filter: brightness(1.15); }

  .stats { display: flex; gap: 15px; }
  .stat {
    flex: 1; background: rgba(11, 19, 43, 0.6); padding: 16px; border-radius: 12px;
    border: 1px solid var(--border-color); text-align: center;
  }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-val { font-size: 26px; font-weight: 800; }
  .stat-val.acc { color: var(--accent-glow); }
  .stat-val.suc { color: var(--success); }
  .stat-val.dan { color: var(--danger); }

  .log-wrap { flex: 1; display: flex; flex-direction: column; background: #070D1E; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; min-height: 280px; }
  .log-header { padding: 10px 16px; background: #0D162E; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; }
  .clear-btn { background: none; border: 1px solid #415A77; color: var(--text-muted); padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .log-body { padding: 12px 16px; overflow-y: auto; flex: 1; font-family: monospace; font-size: 12px; line-height: 1.6; }
  .log-body div { margin-bottom: 3px; word-break: break-all; }
  .log-body .info { color: #E0E1DD; }
  .log-body .success { color: #00E676; font-weight: bold; }
  .log-body .warn { color: #FFD166; }
  .log-body .error { color: #FF3D71; font-weight: bold; }
  .log-time { color: #778DA9; margin-right: 6px; }

  .btn-ready {
    width: 100%; padding: 16px; background: linear-gradient(135deg, #00E676, #00B0FF);
    border: none; border-radius: 10px; color: #070D1E; font-size: 16px; font-weight: 900;
    cursor: pointer; box-shadow: 0 0 20px rgba(0, 230, 118, 0.4); margin-bottom: 12px;
    display: none; animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.015); } 100% { transform: scale(1); } }
  
  .controls { display: flex; gap: 10px; }
  .btn-start { flex: 2; padding: 14px; background: linear-gradient(135deg, #0056b3, #00B0FF); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
  .btn-pause { flex: 1; padding: 14px; background: linear-gradient(135deg, #FFB300, #FF8F00); border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; }
  .btn-stop { flex: 1; padding: 14px; background: linear-gradient(135deg, #FF3D71, #D81B60); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
  .btn-start:disabled, .btn-pause:disabled, .btn-stop:disabled { opacity: 0.35; cursor: not-allowed; }

  .status-bar { padding: 8px 30px; background: #060B18; border-top: 1px solid var(--border-color); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .dot.running { background: var(--success); box-shadow: 0 0 8px var(--success); }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-title">🔐 보안 인증</div>
    <div class="lock-subtitle">신한라이프 카카오톡 자동화 시스템</div>
    <input type="password" id="pass-input" class="lock-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')verifyPass()">
    <button class="lock-btn" onclick="verifyPass()">🔓  인증 및 대시보드 접속</button>
  </div>
</div>

<div class="header">
  <div class="header-left">
    <div class="logo-box"><div class="brand-text">Shinhan Life</div></div>
    <h1>카카오톡 고객 관리 프로그램</h1>
  </div>
</div>

<div class="body">
  <div class="card left-panel">
    <div class="card-title">⚙️ 발송 옵션 설정</div>
    <div class="form">
      <label>📌 발송 방식 선택</label>
      <select id="send_mode">
        <option value="chat_folder" selected>📁 [1옵션] 카톡 "기고객님들" 채팅 폴더 전원 자동 발송</option>
      </select>

      <label>💬 보낼 메시지 문구 (텍스트)</label>
      <textarea id="direct_msg" placeholder="2026년 8월 28일 금요일 소식 전해 드립니다♡"></textarea>

      <!-- 1회성 사진/카드뉴스 첨부 섹션 -->
      <label>📸 사진/카드뉴스 첨부 (1회성 콤보 발송)</label>
      <div class="img-upload-box">
        <input type="file" id="img-file-input" accept="image/*" style="display:none" onchange="handleImageSelected(event)">
        <div id="img-status-txt" style="font-size:12px; color:var(--text-muted);">첨부된 사진이 없습니다. (텍스트만 발송)</div>
        <img id="img-preview" class="img-preview" src="/preview_image" alt="첨부 미리보기">
        <div class="img-btn-row">
          <button type="button" class="file-btn" onclick="document.getElementById('img-file-input').click()">📁 사진/이미지 파일 선택</button>
          <button type="button" id="btn-del-img" class="del-img-btn" onclick="clearAttachedImage()">❌ 사진 제거</button>
        </div>
      </div>

      <label>⏱️ 발송 간격 (최소~최대 초)</label>
      <div style="display:flex;gap:8px">
        <input id="delay_min" type="number" min="1" value="2" style="width:50%">
        <input id="delay_max" type="number" min="1" value="4" style="width:50%">
      </div>

      <button class="save-btn" onclick="saveConfig()">💾  설정 저장</button>
    </div>
  </div>

  <div class="right-panel">
    <div class="stats">
      <div class="stat"><div class="stat-label">📊 총 발송 대상</div><div class="stat-val acc" id="cnt-total">0</div></div>
      <div class="stat"><div class="stat-label">✅ 전송 성공</div><div class="stat-val suc" id="cnt-ok">0</div></div>
      <div class="stat"><div class="stat-label">❌ 실패</div><div class="stat-val dan" id="cnt-fail">0</div></div>
    </div>
    <div class="log-wrap">
      <div class="log-header"><span>📜 실시간 발송 로그</span><button class="clear-btn" onclick="clearLog()">지우기</button></div>
      <div class="log-body" id="log"></div>
    </div>
    <div>
      <button class="btn-ready" id="btn-ready" onclick="setReady()">✅  카톡 목록 준비 완료! 자동 발송 시작!</button>
      <div class="controls">
        <button class="btn-start" id="btn-start" onclick="startAuto()">▶   자동 구동 시작</button>
        <button class="btn-pause" id="btn-pause" onclick="togglePause()" disabled>⏸️  일시정지</button>
        <button class="btn-stop"  id="btn-stop"  onclick="stopAuto()" disabled>⬛  중지</button>
      </div>
    </div>
  </div>
</div>

<div class="status-bar"><div class="dot" id="dot"></div><span id="status-txt">대기 중</span></div>

<script>
let lastLogCount = 0;
let cfg = {};
let isPaused = false;

async function verifyPass() {
  const p = document.getElementById('pass-input').value;
  try {
    const r = await fetch('/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:p})});
    const res = await r.json();
    if(res.ok) {
      document.getElementById('lock-screen').style.display = 'none';
    } else {
      alert('비밀번호가 일치하지 않습니다.');
    }
  } catch(e) {
    alert('인증 서버 연결 오류: ' + e);
  }
}

function updateImageUI(hasImage) {
  const preview = document.getElementById('img-preview');
  const txt = document.getElementById('img-status-txt');
  const delBtn = document.getElementById('btn-del-img');
  if (hasImage) {
    preview.src = '/preview_image?t=' + new Date().getTime();
    preview.style.display = 'block';
    txt.textContent = '📸 사진이 첨부되었습니다. [텍스트 ➔ 사진] 순서로 발송됩니다.';
    txt.style.color = '#00E676';
    delBtn.style.display = 'inline-block';
  } else {
    preview.style.display = 'none';
    txt.textContent = '첨부된 사진이 없습니다. (텍스트만 발송)';
    txt.style.color = 'var(--text-muted)';
    delBtn.style.display = 'none';
  }
}

async function handleImageSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const r = await fetch('/api/upload_image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: file
    });
    const res = await r.json();
    if (res.ok) {
      updateImageUI(true);
    } else {
      alert('이미지 업로드 실패: ' + res.error);
    }
  } catch(e) {
    alert('이미지 전송 오류: ' + e);
  }
}

async function clearAttachedImage() {
  try {
    await fetch('/api/clear_image', {method: 'POST'});
    updateImageUI(false);
  } catch(e) {}
}

function loadKakaoConfig() {
  document.getElementById('send_mode').value = cfg.send_mode || 'chat_folder';
  document.getElementById('direct_msg').value = cfg.direct_msg || '2026년 8월 28일 금요일 소식 전해 드립니다♡';
  document.getElementById('delay_min').value = cfg.delay_min || 2;
  document.getElementById('delay_max').value = cfg.delay_max || 4;
  updateImageUI(cfg.has_image || false);
}

async function loadConfig() {
  try {
    const r = await fetch('/config');
    cfg = await r.json();
    loadKakaoConfig();
  } catch(e){}
}

async function saveConfig() {
  cfg.send_mode = document.getElementById('send_mode').value;
  cfg.direct_msg = document.getElementById('direct_msg').value;
  cfg.delay_min = parseFloat(document.getElementById('delay_min').value)||2;
  cfg.delay_max = parseFloat(document.getElementById('delay_max').value)||4;
  await fetch('/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(cfg)});
  alert('설정이 저장되었습니다!');
}

async function startAuto() {
  await saveConfig();
  await fetch('/start', {method:'POST'});
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-pause').disabled = false;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('btn-ready').style.display = 'block';
  document.getElementById('dot').className = 'dot running';
  document.getElementById('status-txt').textContent = '카톡 폴더 선택 대기 중...';
}

async function togglePause() {
  const targetState = !isPaused;
  await fetch('/pause', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pause: targetState})});
}

async function stopAuto() {
  await fetch('/stop', {method:'POST'});
  document.getElementById('cnt-total').textContent = '0';
  document.getElementById('cnt-ok').textContent = '0';
  document.getElementById('cnt-fail').textContent = '0';
  document.getElementById('status-txt').textContent = '대기 중';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-pause').disabled = true;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-ready').style.display = 'none';
  document.getElementById('dot').className = 'dot';
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
  lastLogCount = 0;
}

async function setReady() {
  await fetch('/ready', {method:'POST'});
  document.getElementById('btn-ready').style.display = 'none';
}

async function poll() {
  try {
    const r = await fetch('/status');
    const s = await r.json();

    document.getElementById('cnt-total').textContent = s.total || 0;
    document.getElementById('cnt-ok').textContent = s.success || 0;
    document.getElementById('cnt-fail').textContent = s.fail || 0;
    document.getElementById('status-txt').textContent = s.status || '대기 중';

    isPaused = s.paused;
    const btnPause = document.getElementById('btn-pause');
    if (isPaused) {
      btnPause.textContent = '▶️  재개(계속)';
      btnPause.style.background = 'linear-gradient(135deg,#00E676,#00C853)';
    } else {
      btnPause.textContent = '⏸️  일시정지';
      btnPause.style.background = 'linear-gradient(135deg,#FFB300,#FF8F00)';
    }

    const btnReady = document.getElementById('btn-ready');
    if (s.running) {
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-pause').disabled = false;
      document.getElementById('btn-stop').disabled = false;
      if (!isPaused) document.getElementById('dot').className = 'dot running';

      if (!s.ready) {
        btnReady.style.display = 'block';
      } else {
        btnReady.style.display = 'none';
      }
    } else {
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-pause').disabled = true;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('dot').className = 'dot';
      btnReady.style.display = 'none';
    }

    if (s.logs && s.logs.length > lastLogCount) {
      const lb = document.getElementById('log');
      const newLogs = s.logs.slice(lastLogCount);
      newLogs.forEach(l => {
        try {
          const d = document.createElement('div');
          d.className = l.level || 'info';
          const msgStr = String(l.msg || '').replace(/</g,'&lt;').replace(/\n/g, '<br>');
          d.innerHTML = '<span class="log-time">['+(l.time||'')+']</span>' + msgStr;
          lb.appendChild(d);
        } catch(err){}
      });
      lastLogCount = s.logs.length;
      lb.scrollTop = lb.scrollHeight;
    }
  } catch(e) {}
  setTimeout(poll, 800);
}

loadConfig();
poll();
</script>
</body>
</html>
