<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinhan Life 카카오톡 고객 관리 프로그램</title>
<style>
:root {
  --bg:#0A0F1D; --card:#111A2E; --card-border:#1E2D4A; --accent:#0066FF;
  --text:#E2E8F0; --text-muted:#8A99AD; --success:#00E676; --danger:#FF3B30; --warning:#FFB300;
  --cyan:#00D2A0;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
#lock-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(5,10,20,0.92);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center}
.lock-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:32px 28px;width:340px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.lock-title{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text)}
.lock-input{width:100%;padding:10px 14px;background:#07132B;border:1px solid var(--card-border);border-radius:8px;color:#fff;font-size:14px;outline:none;margin-bottom:14px;text-align:center}
.lock-input:focus{border-color:var(--accent)}
.lock-btn{width:100%;padding:10px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:0.2s}
.lock-btn:hover{background:#0052cc}
.header{padding:16px 24px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;background:#080E1B}
.header-left{display:flex;align-items:center;gap:12px}
.logo-box{background:#0052cc;padding:4px 10px;border-radius:6px;font-weight:900;font-size:13px;color:#fff;letter-spacing:0.5px}
h1{font-size:18px;font-weight:700;color:#fff}
.body{display:flex;flex:1;padding:20px;gap:20px;overflow:hidden}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.3);overflow-y:auto}
.card-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.form{display:flex;flex-direction:column;gap:12px}
label{font-size:12px;color:var(--text-muted);font-weight:600}
select,input,textarea{background:#07132B;border:1px solid var(--card-border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none;height:100px;line-height:1.4}
.mode-select{border:2px solid var(--warning);background:#07132B;color:#FFF;font-weight:700}

/* 📸 사진 첨부 영역 */
.image-upload-box {
  border: 1.5px dashed var(--card-border);
  border-radius: 8px;
  padding: 10px;
  background: #07132B;
  text-align: center;
  transition: 0.2s;
}
.image-upload-box:hover { border-color: var(--accent); }
.btn-upload-trigger {
  background: #1E2D4A;
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  transition: 0.2s;
}
.btn-upload-trigger:hover { background: #2a3c61; color: #fff; }
.preview-wrap {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.preview-img {
  max-width: 100%;
  max-height: 120px;
  border-radius: 6px;
  border: 1px solid var(--card-border);
  object-fit: contain;
}
.btn-remove-img {
  background: rgba(255, 59, 48, 0.15);
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.btn-remove-img:hover { background: var(--danger); color: #fff; }

.save-btn{width:100%;margin-top:4px;padding:10px;border:none;border-radius:8px;background:linear-gradient(135deg,#002699,#0046FF);color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
.save-btn:hover{filter:brightness(1.15)}
.right{flex:1;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.stats{display:flex;gap:16px}
.stat{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:16px 20px}
.stat-label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:800;color:#fff}
.stat-val.acc{color:var(--accent)}
.stat-val.suc{color:var(--success)}
.stat-val.dan{color:var(--danger)}
.log-wrap{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.log-header{padding:12px 16px;border-bottom:1px solid var(--card-border);font-size:13px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.clear-btn{background:transparent;border:1px solid var(--card-border);color:var(--text-muted);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer}
.clear-btn:hover{background:#1a263f;color:#fff}
.log-body{flex:1;padding:14px 16px;overflow-y:auto;font-family:Consolas,monospace;font-size:12px;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.log-body div{word-break:break-all}
.log-body .info{color:#A0AEC0}
.log-body .success{color:var(--success)}
.log-body .error{color:var(--danger)}
.log-body .warn{color:var(--warning)}
.log-time{color:#4A5568;margin-right:8px}

/* 🟢 초록색 자동 발송 시작 펄스 버튼 */
.btn-ready{
  width:100%;padding:14px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#00E676,#00C853);color:#000;
  font-size:15px;font-weight:900;cursor:pointer;margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,230,118,0.4);animation:pulse 1.5s infinite;
}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

.controls{display:flex;gap:12px}
.controls button{flex:1;padding:14px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:0.2s}
.btn-start{background:linear-gradient(135deg,#0052cc,#0066FF);color:#fff}
.btn-start:hover:not(:disabled){filter:brightness(1.15)}
.btn-start:disabled{background:#1A263F;color:#4A5568;cursor:not-allowed}
.btn-pause{background:linear-gradient(135deg,#FFB300,#FF8F00);color:#000}
.btn-pause:disabled{background:#1A263F;color:#4A5568;cursor:not-allowed}
.btn-stop{background:linear-gradient(135deg,#FF3B30,#D32F2F);color:#fff}
.btn-stop:disabled{background:#1A263F;color:#4A5568;cursor:not-allowed}
.status-bar{padding:8px 24px;border-top:1px solid var(--card-border);font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:8px;background:#080E1B}
.dot{width:8px;height:8px;border-radius:50%;background:#4A5568}
.dot.running{background:var(--success);box-shadow:0 0 8px var(--success)}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-title">🔒 카카오톡 고객 관리 보안 인증</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">시스템 접근을 위해 보안 비밀번호를 입력해 주세요.</div>
    <input type="password" id="pass-input" class="lock-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')verifyPass()">
    <button type="button" class="lock-btn" onclick="verifyPass()">🔓 인증 및 대시보드 접속</button>
  </div>
</div>

<div class="header">
  <div class="header-left">
    <div class="logo-box">Shinhan Life</div>
    <h1>카카오톡 고객 관리 프로그램</h1>
  </div>
</div>

<div class="body">
  <div class="card">
    <div class="card-title">⚙️ 발송 옵션 설정</div>
    <div class="form">
      <label>📌 발송 방식 선택</label>
      <select id="send_mode" class="mode-select">
        <option value="chat_folder" selected>📁 [1옵션] 카톡 "기고객님들" 채팅 폴더 전원 자동 발송</option>
        <option value="favorites">⭐ [2옵션] 카톡 즐겨찾기(Favorites) 목록 전원 자동 발송</option>
      </select>

      <div id="msg-config-box">
        <label>💬 보낼 메시지 문구 (텍스트)</label>
        <textarea id="direct_msg" placeholder="고객님, 이번 한 주도 기분 좋게 시작하세요! 😊"></textarea>
      </div>

      <!-- 📸 사진/이미지 1회성 첨부 영역 -->
      <div>
        <label>📸 사진/카드뉴스 첨부 (1회성 콤보 발송)</label>
        <div class="image-upload-box">
          <input type="file" id="image-file-input" accept="image/*" style="display:none" onchange="handleImageFileSelect(this)">
          <button type="button" class="btn-upload-trigger" id="btn-select-img" onclick="document.getElementById('image-file-input').click()">
            📁 사진/이미지 파일 선택
          </button>
          
          <div class="preview-wrap" id="preview-wrap">
            <img id="preview-img-el" class="preview-img" src="" alt="첨부 미리보기">
            <div style="font-size:11px;color:var(--cyan);">✓ [사진 ➔ 텍스트] 순서로 연속 자동 발송됩니다.</div>
            <button type="button" class="btn-remove-img" onclick="clearAttachedImage()">❌ 사진 제거 (텍스트만 발송)</button>
          </div>
        </div>
      </div>

      <label>⏱️ 발송 간격 (최소~최대 초)</label>
      <div style="display:flex;gap:8px">
        <input id="delay_min" type="number" min="1" value="2" style="width:50%">
        <input id="delay_max" type="number" min="1" value="4" style="width:50%">
      </div>

      <button type="button" class="save-btn" onclick="saveConfig()">💾 설정 저장</button>
    </div>
  </div>

  <div class="right">
    <div class="stats">
      <div class="stat"><div class="stat-label">📊 총 발송 대상</div><div class="stat-val acc" id="cnt-total">0</div></div>
      <div class="stat"><div class="stat-label">✅ 전송 성공</div><div class="stat-val suc" id="cnt-ok">0</div></div>
      <div class="stat"><div class="stat-label">❌ 실패</div><div class="stat-val dan" id="cnt-fail">0</div></div>
    </div>
    <div class="log-wrap">
      <div class="log-header"><span>📜 실시간 발송 로그</span><button type="button" class="clear-btn" onclick="clearLog()">지우기</button></div>
      <div class="log-body" id="log"></div>
    </div>
    <div>
      <button type="button" class="btn-ready" id="btn-ready" onclick="setReady()">✅ 카톡 목록 준비 완료! 자동 발송 시작!</button>
      <div class="controls">
        <button type="button" class="btn-start" id="btn-start" onclick="startAuto()">▶ 자동 구동 시작</button>
        <button type="button" class="btn-pause" id="btn-pause" onclick="togglePause()" disabled>⏸️ 일시정지</button>
        <button type="button" class="btn-stop"  id="btn-stop"  onclick="stopAuto()" disabled>⬛ 중지</button>
      </div>
    </div>
  </div>
</div>

<div class="status-bar"><div class="dot" id="dot"></div><span id="status-txt">대기 중</span></div>

<script>
let lastLogCount = 0;
let cfg = {};
let isPaused = false;

async function verifyPass() {
  const p = document.getElementById('pass-input').value;
  try {
    const r = await fetch('/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:p})});
    const res = await r.json();
    if(res.ok) {
      document.getElementById('lock-screen').style.display = 'none';
    } else {
      alert('비밀번호가 일치하지 않습니다.');
    }
  } catch(e) {
    document.getElementById('lock-screen').style.display = 'none';
  }
}

// 📸 이미지 파일 선택 및 업로드
async function handleImageFileSelect(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    
    reader.onload = async function(e) {
      // 1. 화면에 미리보기 표시
      document.getElementById('preview-img-el').src = e.target.result;
      document.getElementById('preview-wrap').style.display = 'flex';
      document.getElementById('btn-select-img').style.display = 'none';
      
      // 2. 서버로 이미지 바이너리 전송
      try {
        await fetch('/api/upload_image', {
          method: 'POST',
          headers: {'Content-Type': 'application/octet-stream'},
          body: file
        });
      } catch(err) {
        console.error('이미지 업로드 실패:', err);
      }
    };
    reader.readAsDataURL(file);
  }
}

// 📸 첨부된 이미지 삭제
async function clearAttachedImage() {
  document.getElementById('image-file-input').value = '';
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('btn-select-img').style.display = 'block';
  try {
    await fetch('/api/clear_image', {method: 'POST'});
  } catch(e) {}
}

async function loadConfig() {
  try {
    const r = await fetch('/config');
    cfg = await r.json();
    if(cfg.send_mode) document.getElementById('send_mode').value = cfg.send_mode;
    if(cfg.direct_msg) document.getElementById('direct_msg').value = cfg.direct_msg;
    if(cfg.delay_min) document.getElementById('delay_min').value = cfg.delay_min;
    if(cfg.delay_max) document.getElementById('delay_max').value = cfg.delay_max;

    // 기존에 첨부된 이미지가 있으면 미리보기 로드
    if(cfg.has_image) {
      document.getElementById('preview-img-el').src = '/preview_image?' + Date.now();
      document.getElementById('preview-wrap').style.display = 'flex';
      document.getElementById('btn-select-img').style.display = 'none';
    }
  } catch(e) {}
}

async function saveConfig() {
  const newCfg = {
    send_mode: document.getElementById('send_mode').value,
    direct_msg: document.getElementById('direct_msg').value,
    delay_min: parseFloat(document.getElementById('delay_min').value) || 2,
    delay_max: parseFloat(document.getElementById('delay_max').value) || 4
  };
  try {
    await fetch('/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(newCfg)});
    alert('💾 설정이 안전하게 저장되었습니다!');
  } catch(e) {
    alert('설정 저장 중 오류가 발생했습니다.');
  }
}

async function startAuto() {
  await saveConfigSilent();
  await fetch('/start', {method:'POST'});
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-pause').disabled = false;
  document.getElementById('btn-stop').disabled = false;
}

async function setReady() {
  await saveConfigSilent();
  await fetch('/start', {method:'POST'});
  await fetch('/ready', {method:'POST'});
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-pause').disabled = false;
  document.getElementById('btn-stop').disabled = false;
}

async function togglePause() {
  const r = await fetch('/pause', {method:'POST'});
  const res = await r.json();
  isPaused = res.paused;
  document.getElementById('btn-pause').innerText = isPaused ? '▶️ 재개' : '⏸️ 일시정지';
}

async function stopAuto() {
  await fetch('/stop', {method:'POST'});
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-pause').disabled = true;
  document.getElementById('btn-stop').disabled = true;
}

async function saveConfigSilent() {
  const newCfg = {
    send_mode: document.getElementById('send_mode').value,
    direct_msg: document.getElementById('direct_msg').value,
    delay_min: parseFloat(document.getElementById('delay_min').value) || 2,
    delay_max: parseFloat(document.getElementById('delay_max').value) || 4
  };
  try {
    await fetch('/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(newCfg)});
  } catch(e) {}
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}

setInterval(async () => {
  try {
    const r = await fetch('/status');
    const st = await r.json();
    document.getElementById('cnt-total').innerText = st.total || 0;
    document.getElementById('cnt-ok').innerText = st.success || 0;
    document.getElementById('cnt-fail').innerText = st.fail || 0;
    document.getElementById('status-txt').innerText = st.status || '대기 중';
    
    const dot = document.getElementById('dot');
    if(st.running) {
      dot.classList.add('running');
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-pause').disabled = false;
      document.getElementById('btn-stop').disabled = false;
    } else {
      dot.classList.remove('running');
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-pause').disabled = true;
      document.getElementById('btn-stop').disabled = true;
    }

    if(st.logs && st.logs.length > 0) {
      const box = document.getElementById('log');
      box.innerHTML = st.logs.map(l => `<div class="${l.level||'info'}"><span class="log-time">[${l.time}]</span>${l.msg}</div>`).join('');
      box.scrollTop = box.scrollHeight;
    }
  } catch(e) {}
}, 800);

window.addEventListener('DOMContentLoaded', loadConfig);
</script>
</body>
</html>
